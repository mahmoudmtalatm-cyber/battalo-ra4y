<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8f3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Battalo Ra4y">
<title>بطلوا رغي · Battalo Ra4y</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#e8f3ff; --bg2:#f5faff; --surface:#ffffff; --ink:#0e2a47; --muted:#5d7a99; --line:#d2e4f6;
  --p:#2f8fff; --p2:#7cc2ff; --pd:#1769cf; --soft:#e0efff; --soft2:#cfe5ff;
  --ok:#22b07d; --bad:#ee5a6c; --warn:#f6a823; --teal:#18a5b8;
  --r:18px; --r-s:12px;
  --shadow:0 6px 20px rgba(32,100,180,.12); --shadow-s:0 2px 8px rgba(32,100,180,.10);
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:linear-gradient(180deg,var(--bg2),var(--bg) 40%);box-shadow:0 0 0 1px var(--line)}
@media(min-width:600px){body{background:#d9ebff}.app{box-shadow:0 10px 50px rgba(30,90,170,.18);border-radius:0}}

/* ---------- header ---------- */
.topbar{position:relative;padding:calc(var(--st) + 14px) 18px 12px;display:flex;align-items:center;gap:12px;flex:none;overflow:hidden}
.topbar::before,.topbar::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(124,194,255,.45),rgba(124,194,255,0) 70%);pointer-events:none}
.topbar::before{width:200px;height:200px;right:-60px;top:-90px}
.topbar::after{width:140px;height:140px;left:-50px;top:-40px;opacity:.7}
.logo{flex:none;width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--p2),var(--p));box-shadow:0 6px 14px rgba(47,143,255,.35);display:grid;place-items:center;position:relative;z-index:1}
.logo svg{width:28px;height:28px}
.brand{position:relative;z-index:1;min-width:0}
.brand .ar{font-size:25px;font-weight:800;line-height:1.15;color:var(--pd);direction:rtl;unicode-bidi:isolate;text-align:left;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif}
.brand .fr{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.conn{font-family:inherit;cursor:pointer;max-width:27vw;margin-left:auto;padding:6px 10px;position:relative;z-index:1;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow-s)}
.conn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn[hidden]{display:none}
.brand .fr{white-space:nowrap}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row-h .h2{margin-top:14px;margin-bottom:6px}
.conn i{flex:none;width:9px;height:9px;border-radius:50%;background:#b8c7d8}
.conn.on i{background:var(--ok);box-shadow:0 0 0 4px rgba(34,176,125,.18)}
.conn.on{color:var(--ink)}
.conn.try i{background:var(--warn)}

/* ---------- views ---------- */
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;padding:4px 16px calc(96px + var(--sb));display:none;-webkit-overflow-scrolling:touch}
.view.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h2{font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 4px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-s);padding:16px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;background:#fff;border:1.5px solid var(--soft2);color:var(--pd);transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#4aa3ff,var(--p));color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(47,143,255,.32)}
.btn.danger{color:var(--bad);border-color:#f7cdd3}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:11px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--pd);position:relative}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{background:var(--soft)}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}

/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,#3d9bff,#6cc0ff);color:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 24px rgba(47,143,255,.3);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:160px;height:160px;right:-40px;bottom:-60px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero h3{margin:0 0 4px;font-size:19px}
.hero p{margin:0 0 12px;opacity:.95;font-size:14px;max-width:92%}
.hero .btn{background:#fff;color:var(--pd);border:0}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:10px;min-height:150px;transition:transform .12s,box-shadow .12s;position:relative}
.game-card:active{transform:scale(.97)}
.game-card .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--soft);color:var(--pd)}
.game-card .ico svg{width:30px;height:30px}
.game-card b{font-size:16px}
.game-card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--pd)}
.tag.g{background:#dff7ee;color:#118a60}
.game-card.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.tint1 .ico{background:linear-gradient(145deg,#dff0ff,#bcdcff)}.tint2 .ico{background:linear-gradient(145deg,#e4f7f3,#bfeadf)}
.tint3 .ico{background:linear-gradient(145deg,#fff1dc,#ffe0b0)}.tint4 .ico{background:linear-gradient(145deg,#ece6ff,#d6cbff)}
.tint5 .ico{background:linear-gradient(145deg,#ffe5ea,#ffc9d3)}.tint6 .ico{background:linear-gradient(145deg,#e0f4ff,#b4e3ff)}

/* ---------- players ---------- */
.me-card{display:flex;align-items:center;gap:12px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(145deg,var(--p2),var(--p))}
.plist{display:flex;flex-direction:column;gap:9px}
.player{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px}
.player .st{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.player .st i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.player.busy .st i{background:var(--warn)}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:6px}
.qr{display:grid;place-items:center;background:#fff;border-radius:16px;padding:12px;border:1px solid var(--line);width:fit-content;margin:10px auto}
.qr svg,.qr img{display:block;width:170px;height:170px}
.urlchip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;background:var(--soft);color:var(--pd);padding:7px 11px;border-radius:10px;word-break:break-all;display:inline-block}
.steps{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
.steps li{margin:5px 0}

/* ---------- tabbar ---------- */
.tabbar{position:absolute;left:12px;right:12px;bottom:calc(10px + var(--sb));display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(30,100,190,.2);z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:16px;color:var(--muted);font-size:11.5px;font-weight:700;position:relative;transition:background .15s,color .15s}
.tab svg{width:24px;height:24px}
.tab.active{background:var(--soft);color:var(--pd)}
.tab .badge{top:1px;right:calc(50% - 25px)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid #fff}

/* ---------- sheets / modal / toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(14,42,71,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeb .18s ease}
@keyframes fadeb{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + var(--sb));animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60%);opacity:.4}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--soft2);margin:4px auto 14px}
.sheet h3{margin:0 0 4px;font-size:20px}
.center-modal{align-items:center;padding:20px}
.center-modal .sheet{border-radius:24px;max-width:380px;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.opt{margin:14px 0 6px}
.opt label.t{display:block;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:9px 10px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--soft);border-color:var(--p);color:var(--pd)}
.toasts{position:fixed;left:0;right:0;top:calc(var(--st) + 12px);z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:90%;animation:drop .25s ease}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.invite-banner{position:fixed;left:12px;right:12px;top:calc(var(--st) + 10px);max-width:536px;margin:0 auto;z-index:90;background:#fff;border:1.5px solid var(--p2);border-radius:20px;padding:14px;box-shadow:0 14px 40px rgba(30,100,190,.35);animation:drop .3s ease}
.invite-banner .bar{height:4px;border-radius:2px;background:var(--soft);margin-top:12px;overflow:hidden}
.invite-banner .bar i{display:block;height:100%;background:var(--p);animation:shrink 60s linear forwards}
@keyframes shrink{to{width:0}}
.invite-banner i.bar0{width:100%}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:6px 2px 10px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;padding:8px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.msg .who{font-size:11.5px;font-weight:800;color:var(--teal);margin-bottom:1px}
.msg .tm{font-size:10.5px;color:var(--muted);margin-left:8px;float:right;margin-top:4px}
.msg.mine{align-self:flex-end;background:linear-gradient(180deg,#4aa3ff,var(--p));color:#fff;border:0}
.msg.mine .tm{color:rgba(255,255,255,.75)}
.msg.sys{align-self:center;background:transparent;border:0;color:var(--muted);font-size:12.5px;padding:2px}
.composer{flex:none;display:flex;gap:8px;padding-top:8px;align-items:center}
.composer input{flex:1;height:46px;border-radius:15px;border:1.5px solid var(--line);padding:0 14px;background:#fff;outline:none;min-width:0}
.composer input:focus{border-color:var(--p)}
.quick{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;flex:none}
.quick button{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:15px}
#chatView{padding-bottom:calc(96px + var(--sb))}

/* ---------- watch / coming soon ---------- */
.soon-hero{background:linear-gradient(135deg,#e1f0ff,#f6fbff);border:1px dashed var(--p2);border-radius:22px;padding:22px 18px;text-align:center}
.soon-hero .big{font-size:44px}
.ribbon{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--warn);color:#fff}
.watch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.watch-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;display:flex;flex-direction:column;gap:8px;position:relative;opacity:.92}
.watch-card .ico{font-size:30px}
.watch-card .ribbon{position:absolute;top:10px;right:10px;font-size:9.5px;padding:3px 8px}
.watch-card b{margin-top:6px}

/* ---------- game screen ---------- */
.game-screen{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,var(--bg2),var(--bg));display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.gbar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 12px 8px}
.gbar .ttl{flex:1;min-width:0}
.gbar .ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .ttl span{font-size:12.5px;color:var(--muted)}
.gbody{flex:1;min-height:0;overflow-y:auto;padding:4px 14px calc(18px + var(--sb));-webkit-overflow-scrolling:touch}
.gfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chatdrawer{position:absolute;left:0;right:0;bottom:0;height:62%;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(20,80,160,.28);z-index:10;padding:10px 14px calc(12px + var(--sb));display:flex;flex-direction:column;animation:up .25s ease}
.chatdrawer .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chatdrawer .hd b{flex:1}
.statusline{text-align:center;font-weight:700;color:var(--pd);min-height:24px;margin:6px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13.5px}
.pill.turn{border-color:var(--p);background:var(--soft);color:var(--pd)}
.scorebar{display:flex;justify-content:space-between;gap:8px;margin:6px 0}
.overlay-msg{position:absolute;inset:0;background:rgba(232,243,255,.88);backdrop-filter:blur(3px);z-index:8;display:grid;place-items:center;padding:24px;text-align:center}
.result{background:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line);max-width:340px;width:100%}
.result .big{font-size:48px}
.result h3{margin:6px 0 4px;font-size:22px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- chess ---------- */
.chess-wrap{width:100%;max-width:min(520px,calc(100vh - 330px));min-width:280px;margin:0 auto}
@media (max-height:640px){.chess-wrap{max-width:calc(100vw - 28px)}}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:3px solid #fff;user-select:none;-webkit-user-select:none;touch-action:none}
.sq{position:relative;display:grid;place-items:center}
.sq.l{background:#eaf4ff}.sq.d{background:#7fb4e8}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(255,214,10,.42)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(255,214,10,.7)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(238,90,108,.95),rgba(238,90,108,0) 72%)}
.sq.hint::before{content:"";position:absolute;inset:0;background:rgba(34,176,125,.5)}
.sq .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(14,42,71,.26);pointer-events:none}
.sq.cap .dot{width:88%;height:88%;background:transparent;border:5px solid rgba(14,42,71,.26)}
.sq .pc{position:absolute;inset:3%;background-size:contain;background-repeat:no-repeat;background-position:center;pointer-events:none;transition:transform .12s}
.sq .co{position:absolute;font-size:10px;font-weight:800;opacity:.7;pointer-events:none}
.sq.l .co{color:#5b97d1}.sq.d .co{color:#eaf4ff}
.sq .co.r{top:2px;left:3px}.sq .co.f{bottom:1px;right:3px}
.pc.drag{transform:scale(1.18);z-index:20}
.capbar{display:flex;align-items:center;gap:8px;min-height:30px;padding:4px 4px}
.capbar .nm{font-weight:800;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.capbar .caps{display:flex;flex-wrap:wrap;height:22px;align-items:center}
.capbar .caps i{width:16px;height:22px;background-size:contain;background-repeat:no-repeat;margin-right:-6px}
.capbar .adv{font-size:12.5px;font-weight:800;color:var(--muted)}
.movelist{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.movelist span{background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px 8px}
.movelist span.cur{background:var(--soft);color:var(--pd);border-color:var(--p2)}
.promo{position:absolute;inset:0;background:rgba(14,42,71,.5);z-index:9;display:grid;place-items:center}
.promo div{display:flex;gap:8px;background:#fff;padding:10px;border-radius:16px}
.promo i{width:62px;height:62px;background-size:contain;border-radius:12px;background-color:var(--soft);cursor:pointer}
.think{display:inline-block;width:14px;height:14px;border:2.5px solid var(--soft2);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- sudoku ---------- */
.sdk-info{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 8px;font-weight:700;font-size:14px;color:var(--muted);gap:8px}
.sdk-info b{color:var(--ink)}
.sdk-grid{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;width:100%;max-width:min(480px,calc(100vh - 360px));min-width:290px;margin:0 auto;background:var(--ink);border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;gap:1px;box-shadow:var(--shadow)}
@media (max-height:660px){.sdk-grid{max-width:calc(100vw - 28px)}}
.cell{position:relative;background:#fff;display:grid;place-items:center;font-size:clamp(17px,5.6vw,28px);font-weight:600;color:var(--pd);user-select:none;-webkit-user-select:none;cursor:pointer}
.cell.r2,.cell.r5{margin-bottom:2px}.cell.c2,.cell.c5{margin-right:2px}
.cell.given{color:var(--ink);font-weight:800;background:#f4f9ff}
.cell.rel{background:#e6f1ff}.cell.given.rel{background:#dcebfb}
.cell.same{background:#c5dffc}.cell.sel{background:#9fcdff!important}
.cell.err{color:var(--bad);background:#ffe7ea}
.cell.theirs{color:var(--teal)}
.cell.conf{background:#ffe7ea}
.notes{position:absolute;inset:1px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(8px,2.4vw,12px);font-weight:700;color:#5b86b5;line-height:1}
.notes span{display:grid;place-items:center}
.notes span.hl{color:var(--pd);background:#b9dbff;border-radius:3px}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:12px auto 0;max-width:480px}
.pad button{aspect-ratio:.8;border-radius:12px;background:#fff;border:1.5px solid var(--soft2);font-size:clamp(20px,6vw,28px);font-weight:700;color:var(--pd);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1}
.pad button small{font-size:10px;color:var(--muted);font-weight:700;margin-top:3px}
.pad button:active{background:var(--soft)}
.pad button[disabled]{opacity:.25;pointer-events:none}
.pad.notes-on button{background:#fff7e3;border-color:#f7d58a;color:#b27a0a}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:480px;margin:12px auto 0}
.tools button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tools button svg{width:25px;height:25px;color:var(--pd)}
.tools button.on{background:#fff7e3;color:#b27a0a}.tools button.on svg{color:#d89414}
.tools .cnt{position:absolute;top:2px;right:calc(50% - 25px);min-width:17px;height:17px;border-radius:9px;background:var(--p);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.prog{height:9px;background:var(--soft);border-radius:5px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:5px;transition:width .35s}
.prog.opp i{background:linear-gradient(90deg,#5fd0d8,var(--teal))}
.paused{position:absolute;inset:0;background:rgba(232,243,255,.96);display:grid;place-items:center;text-align:center;font-weight:800;color:var(--pd);z-index:3;border-radius:10px}

/* ---------- xo / c4 ---------- */
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,380px);margin:14px auto;aspect-ratio:1}
.xo button{background:#fff;border:1.5px solid var(--line);border-radius:20px;font-size:clamp(44px,16vw,80px);font-weight:800;display:grid;place-items:center;box-shadow:var(--shadow-s);line-height:1}
.xo button.X{color:var(--p)}.xo button.O{color:var(--warn)}
.xo button.win{background:#e3fbf1;border-color:var(--ok)}
.xo button:not(:disabled):not(.X):not(.O):active{background:var(--soft)}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--p);padding:8px;border-radius:18px;width:min(100%,430px);margin:12px auto;box-shadow:var(--shadow);border-bottom:6px solid var(--pd)}
.c4 .col{display:flex;flex-direction:column;gap:5px;cursor:pointer;border-radius:10px;padding:0}
.c4 .col:active{background:rgba(255,255,255,.12)}
.c4 .slot{aspect-ratio:1;border-radius:50%;background:var(--bg2);box-shadow:inset 0 3px 6px rgba(14,60,130,.35);position:relative;overflow:hidden}
.c4 .slot i{position:absolute;inset:0;border-radius:50%;animation:dropin .38s cubic-bezier(.4,.1,.5,1.1)}
@keyframes dropin{from{transform:translateY(-480%)}}
.c4 .slot i.R{background:radial-gradient(circle at 35% 30%,#ff8e9b,var(--bad))}
.c4 .slot i.Y{background:radial-gradient(circle at 35% 30%,#ffe486,var(--warn))}
.c4 .slot.win{box-shadow:0 0 0 4px #fff,inset 0 3px 6px rgba(14,60,130,.35)}
.c4 .slot.lastm{outline:3px solid rgba(255,255,255,.7)}

/* ---------- rps ---------- */
.rps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px auto;max-width:400px}
.rps button{aspect-ratio:1;background:#fff;border:1.5px solid var(--line);border-radius:22px;font-size:46px;display:grid;place-items:center;box-shadow:var(--shadow-s)}
.rps button.pick{border-color:var(--p);background:var(--soft);transform:scale(1.04)}
.rps button[disabled]{opacity:.5;pointer-events:none}
.arena{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0;min-height:110px}
.arena .hand{width:96px;height:96px;border-radius:26px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-size:52px;box-shadow:var(--shadow-s)}
.arena .hand.win{border-color:var(--ok);background:#e3fbf1}.arena .hand.lose{opacity:.55}
.arena .vs{font-weight:800;color:var(--muted)}
.rounds{display:flex;gap:6px;justify-content:center;margin:6px 0}
.rounds i{width:12px;height:12px;border-radius:50%;background:var(--soft2)}
.rounds i.w{background:var(--ok)}.rounds i.l{background:var(--bad)}.rounds i.d{background:var(--warn)}

/* ---------- memory ---------- */
.mem{display:grid;gap:8px;margin:12px auto;max-width:440px;width:100%}
.mem .card3d{aspect-ratio:1;perspective:600px;cursor:pointer}
.mem .inner{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mem .card3d.up .inner,.mem .card3d.done .inner{transform:rotateY(180deg)}
.mem .f,.mem .b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mem .b{background:linear-gradient(145deg,#5fb0ff,var(--p));box-shadow:var(--shadow-s);color:rgba(255,255,255,.7);font-size:24px}
.mem .f{background:#fff;border:1.5px solid var(--line);transform:rotateY(180deg);font-size:clamp(24px,8vw,38px)}
.mem .card3d.done .f{background:#e3fbf1;border-color:var(--ok)}
.mem .card3d.mine .f{background:#e0efff;border-color:var(--p)}.mem .card3d.theirs .f{background:#dff6f8;border-color:var(--teal)}
.pill.me{background:var(--soft);border-color:var(--p);color:var(--pd)}
.pill.th{background:#dff6f8;border-color:var(--teal);color:#0b7c8b}
.seg.stretch button{flex:1}
.hint-txt{font-size:13px;color:var(--muted);text-align:center;margin:6px 0}

/* ---------- misc additions ---------- */
.ic{width:22px;height:22px;flex:none}
.ic.i20{width:20px;height:20px}
.tab .ic{width:24px;height:24px}
.iconbtn .ic{width:22px;height:22px}
.tools button .ic{width:25px;height:25px;color:var(--pd)}
.tools button.on .ic{color:#d89414}
.btn .ic{width:18px;height:18px}
.composer .btn{min-width:48px;padding:0 14px}
.composer .btn .ic{width:20px;height:20px}
#chatView.active{display:flex;flex-direction:column}
#chatHost{flex:1;min-height:0}
.chatdrawer .chat{flex:1;min-height:0}
.player.tint1,.player.tint2,.player.tint3,.player.tint4,.player.tint5,.player.tint6{width:100%}
.player .ico{flex:none}
button.player{font:inherit;color:inherit;cursor:pointer}
.sdk-info>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdk-info>.row{flex:none}

/* ---------- logo frame ---------- */
.logo{padding:3px;background:linear-gradient(145deg,#d6edff 0%,#7cc2ff 45%,#2f8fff 100%);border-radius:19px;box-shadow:0 6px 16px rgba(47,143,255,.38),0 0 0 3px rgba(255,255,255,.75);width:54px;height:54px;display:block;position:relative;z-index:1}
.logo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:16px;border:2px solid #fff;background:#fff}
.logo.big{width:132px;height:132px;border-radius:38px;padding:5px}
.logo.big img{border-radius:32px;border-width:3px}

/* ---------- fake loading screen ---------- */
#loader{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#f6fbff,#d9ecff 55%,#bcdcff);transition:opacity .5s ease,transform .5s ease,visibility .5s}
#loader.out{opacity:0;transform:scale(1.04);visibility:hidden;pointer-events:none}
.ld-bubbles i{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(124,194,255,.35));animation:floaty 6s ease-in-out infinite}
.ld-bubbles i:nth-child(1){width:90px;height:90px;left:8%;top:12%}
.ld-bubbles i:nth-child(2){width:44px;height:44px;right:12%;top:20%;animation-delay:-2s}
.ld-bubbles i:nth-child(3){width:130px;height:130px;right:-30px;bottom:14%;animation-delay:-1s}
.ld-bubbles i:nth-child(4){width:60px;height:60px;left:14%;bottom:18%;animation-delay:-3s}
.ld-bubbles i:nth-child(5){width:26px;height:26px;left:48%;top:8%;animation-delay:-4s}
@keyframes floaty{50%{transform:translateY(-18px)}}
.ld-card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 28px;width:100%;max-width:360px}
.ld-logo{position:relative;display:grid;place-items:center;width:170px;height:170px;margin-bottom:10px}
.ld-logo .logo{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.ld-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(47,143,255,.45);animation:ring 2.2s ease-out infinite}
.ld-ring.r2{animation-delay:1.1s}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.25);opacity:0}}
.ld-ar{font-size:34px;font-weight:800;color:var(--pd);line-height:1.2;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif}
.ld-fr{font-size:14px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:2px 0 24px}
.ld-bar{width:100%;height:12px;border-radius:7px;background:rgba(255,255,255,.8);border:1px solid var(--line);overflow:hidden;box-shadow:inset 0 1px 3px rgba(30,100,190,.15)}
.ld-bar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#7cc2ff,#2f8fff);background-size:28px 28px;transition:width .35s ease;box-shadow:0 0 12px rgba(47,143,255,.5);background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%),linear-gradient(90deg,#7cc2ff,#2f8fff);animation:stripes .8s linear infinite}
@keyframes stripes{to{background-position:28px 0,0 0}}
.ld-txt{display:flex;justify-content:space-between;gap:12px;width:100%;margin-top:10px;font-size:13.5px;color:var(--muted);font-weight:600;min-height:20px}
.ld-txt b{color:var(--pd);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.ld-logo .logo,.ld-ring,.ld-bubbles i,.ld-bar i{animation:none}}

/* ---- points chip, leaderboard, install card, no-internet screen ---- */
.pts{position:relative;z-index:1;margin-left:auto;margin-right:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:800;color:var(--pd)}
.pts[hidden]{display:none}
.pts + .conn{margin-left:0}
.pts[hidden] + .conn{margin-left:auto}
.lb-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.lb-row.me{border-color:var(--p);background:var(--soft)}
.lb-rank{flex:none;width:30px;text-align:center;font-weight:800;color:var(--muted);font-size:17px}
.lb-pts{font-size:17px;color:var(--pd);font-variant-numeric:tabular-nums}
.stat3{display:flex;gap:8px;margin-top:12px}
.stat3>div{flex:1;background:var(--soft);border-radius:14px;padding:9px 6px;text-align:center}
.stat3 b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat3 span{font-size:11.5px;color:var(--muted);font-weight:700}
.install-card{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px}

/* ---- Google sign-in button ---- */
.gbtn{background:#fff;border:1.5px solid var(--soft2);color:#1f2d3d;min-height:48px;gap:10px;font-weight:700}
.gbtn:disabled{opacity:.6}

</style>
</head>

  <div class="ld-bubbles"><i></i><i></i><i></i><i></i><i></i></div>

    <div class="ld-logo"><span class="ld-ring"></span><span class="ld-ring r2"></span><div class="logo big"><img src="logo.png" alt="" width="132" height="132"></div></div>

  <main class="views">

    <section class="view" id="lobbyView"></section>

      <div class="h2" style="margin-top:8px">Lobby chat</div>

    <button class="tab" data-v="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.2 7.6L3.5 21l1.4-5A8.5 8.5 0 1 1 21 12z"/></svg>Chat</button>

    <button class="tab" data-v="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="3"/><path d="M10 8.5v4l3.5-2z"/><path d="M8 21h8"/></svg>Watch<span class="dot"></span></button>
  </nav>
</div>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;            // trusted static strings only
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem('br_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('br_' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
  del(k) { try { localStorage.removeItem('br_' + k); } catch (e) { /* ignore */ } },
};

    c4: { easy: 2, medium: 4, hard: 7 },
    rps: { '1': 1, '3': 3, '5': 5 },
    memory: { s: 3, m: 5, l: 8 },
    chess: { '1': 2, '2': 4, '3': 7, '4': 10, '5': 14 },
    sudoku: { easy: 6, medium: 10, hard: 15, expert: 20 },

    row('Memory Match', P.solo.memory.s + ' · ' + P.solo.memory.m + ' · ' + P.solo.memory.l + ' (small · medium · large)'),
    row('Chess', P.solo.chess['1'] + ' · ' + P.solo.chess['2'] + ' · ' + P.solo.chess['3'] + ' · ' + P.solo.chess['4'] + ' · ' + P.solo.chess['5'] + ' (level 1-5)'),
    row('Sudoku', P.solo.sudoku.easy + ' · ' + P.solo.sudoku.medium + ' · ' + P.solo.sudoku.hard + ' · ' + P.solo.sudoku.expert + ' (minus hints and mistakes)'),
    h('p', { class: 'muted small', style: { margin: '10px 0 0' }, text: 'Draws vs the computer give a third of a win. Leaving a game early gives no points.' }),
    h('button', { class: 'btn primary block', style: { marginTop: '14px' }, text: 'Got it', onclick: (e) => e.target.closest('.backdrop').remove() })));
}

function openNameSheet(first) {
  const input = h('input', { type: 'text', maxlength: '16', value: S.me.name || NET.suggestedName(), placeholder: 'Your name', autocomplete: 'off',
    style: { width: '100%', height: '48px', borderRadius: '14px', border: '1.5px solid var(--line)', padding: '0 14px', marginTop: '10px', outline: 'none' } });
  const err = h('div', { class: 'small', style: { color: 'var(--bad)', fontWeight: 700, minHeight: '18px', marginTop: '6px' } });
  const btn = h('button', { class: 'btn primary block', type: 'submit', style: { marginTop: '10px' }, text: first ? "Let's play" : 'Save' });
  let close;
  const done = async () => {
    err.textContent = '';
    const raw = input.value;
    if (!first && NET.cleanName(raw) === S.me.name) { close(); return; }
    btn.disabled = true;
    try {
      const nm = await NET.setName(raw);
      S.me.name = nm; close();
      if (first) begin(); else { renderAll(); toast('Name set to ' + nm); }
    } catch (e) {
      btn.disabled = false;
      err.textContent = e.message === 'short' ? 'Use at least 2 letters or numbers.' : 'Could not save. Check your internet and try again.';
    }
  };
  const body = h('form', { onsubmit: (e) => { e.preventDefault(); done(); } },
    h('h3', { text: first ? 'Welcome! What should we call you?' : 'Change your name' }),
    h('p', { class: 'muted small', style: { margin: '4px 0 0' }, text: 'Friends see this name in the lobby, in chat and on the leaderboard.' }),
    input, err, btn);
  close = openSheet(body, { locked: first });
  setTimeout(() => input.focus(), 250);
}

function openGamePicker(targetId) {
  loadPlayers(false);
  const t = S.players.find((p) => p.id === targetId);
  let close;
  const body = h('div', null,
    h('h3', { text: 'Invite ' + (t ? t.name : 'player') }),
    h('p', { class: 'muted small', style: { margin: '2px 0 10px' }, text: 'Choose a game to request.' }),
    h('div', { class: 'plist' }, GAME_ORDER.filter((id) => GAMES[id] && GAMES[id].multi).map((id) => {
      const g = GAMES[id];
      return h('button', { class: 'player ' + g.tint, style: { textAlign: 'left' }, onclick: () => { close(); openGameSheet(id, targetId); } },
        h('div', { class: 'ico', html: g.icon, style: { width: '42px', height: '42px', borderRadius: '13px', display: 'grid', placeItems: 'center', fontSize: '24px', background: 'var(--soft)' } }),
        h('div', { class: 'grow' }, h('b', { text: g.name }), h('div', { class: 'muted small', text: g.tagline })));
    })));
  close = openSheet(body);
}

let sheetRefreshers = new Set();
function refreshOpenSheets() { sheetRefreshers.forEach((f) => f()); }

function openGameSheet(id, targetId) {
  const def = GAMES[id];
  if (S.online && (!targetId || !S.playersLoaded) && def.multi) loadPlayers(false);
  const saved = store.get('o_' + id, {});
  const opts = {};
  def.options.forEach((o) => { opts[o.key] = saved[o.key] != null && o.choices.some((c) => c[0] === saved[o.key]) ? saved[o.key] : o.def; });
  let mode = targetId ? 'multi' : (def.solo ? 'solo' : 'multi');
  const body = h('div');
  let close;
  const render = () => {
    const target = targetId ? S.players.find((p) => p.id === targetId) : null;
    const parts = [];
    parts.push(h('div', { class: 'row', style: { gap: '12px', marginBottom: '4px' } },
      h('div', { class: 'ico', html: def.icon, style: { width: '52px', height: '52px', borderRadius: '16px', display: 'grid', placeItems: 'center', fontSize: '28px', background: 'var(--soft)', color: 'var(--pd)' } }),
      h('div', null, h('h3', { text: def.name, style: { margin: 0 } }), h('div', { class: 'muted small', text: def.desc }))));
    if (!targetId && def.solo && def.multi) {
      parts.push(h('div', { class: 'opt' }, h('div', { class: 'seg stretch' },
        h('button', { class: mode === 'solo' ? 'on' : '', text: 'Solo', onclick: () => { mode = 'solo'; render(); } }),
        h('button', { class: mode === 'multi' ? 'on' : '', text: 'With a friend', onclick: () => { mode = 'multi'; render(); } }))));
    }
    def.options.filter((o) => !o.mode || o.mode === mode).forEach((o) => {
      parts.push(h('div', { class: 'opt' }, h('label', { class: 't', text: o.label }),
        h('div', { class: 'seg' }, o.choices.map(([v, l]) => h('button', { class: opts[o.key] === v ? 'on' : '', text: l, onclick: () => { opts[o.key] = v; store.set('o_' + id, opts); render(); } })))));
    });
    parts.push(h('div', { style: { height: '12px' } }));
    if (mode === 'solo') {
      parts.push(h('button', { class: 'btn primary block', text: def.soloLabel || 'Start', onclick: () => { close(); openGame(def, 'solo', { ...opts }); } }));
    } else if (targetId) {
      parts.push(h('button', { class: 'btn primary block', disabled: !target || target.status !== 'free', text: target ? 'Send request to ' + target.name : 'Player left', onclick: () => { sendInvite(targetId, def, opts); close(); } }));
    } else {
      const free = others();
      parts.push(h('label', { class: 't', style: { display: 'block', fontSize: '12.5px', fontWeight: 800, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--muted)', margin: '0 0 8px' }, text: 'Who do you want to play with?' }));
      parts.push(free.length
        ? h('div', { class: 'plist' }, free.map((p) => h('div', { class: 'player' + (p.status !== 'free' ? ' busy' : '') },
          h('div', { class: 'avatar', text: p.name.charAt(0).toUpperCase(), style: { background: 'linear-gradient(145deg,#7fe0cf,#18a5b8)' } }),
          h('div', { class: 'grow' }, h('b', { text: p.name }), h('div', { class: 'st' }, h('i'), p.status === 'free' ? 'Free to play' : 'In a game')),
          h('button', { class: 'btn primary sm', text: 'Invite', disabled: p.status !== 'free', onclick: () => { sendInvite(p.id, def, opts); close(); } }))))
        : h('div', { class: 'card empty' }, h('div', { class: 'big', text: '🛰️' }), h('b', { text: 'Nobody else is online yet' }),
          h('div', { class: 'small', text: 'Share the game link from the Lobby tab.' }),
          h('button', { class: 'btn sm', style: { marginTop: '10px' }, text: 'Open lobby', onclick: () => { close(); showView('lobby'); } })));
    }
    body.replaceChildren(...parts);
  };
  render();
  close = openSheet(body, { onClose: () => sheetRefreshers.delete(render) });
  sheetRefreshers.add(render);
}

function sendInvite(pid, def, opts) {
  store.set('o_' + def.id, opts);
  const o = def.resolve ? def.resolve({ ...opts }) : { ...opts };
  wsSend({ t: 'invite', to: pid, game: def.id, opts: o });
}

function showWaiting(m) {
  if (S.pendingOut) S.pendingOut.close();
  const body = h('div', { style: { textAlign: 'center' } },
    h('div', { style: { fontSize: '34px', margin: '6px 0' }, text: '⏳' }),
    h('h3', { text: 'Waiting for ' + m.toName }),
    h('p', { class: 'muted small', text: 'They got your request to play ' + (GAMES[m.game] ? GAMES[m.game].name : 'a game') + '.' }),
    h('button', { class: 'btn block', text: 'Cancel request', onclick: () => { wsSend({ t: 'invite_cancel', inviteId: m.inviteId }); S.pendingOut.close(); S.pendingOut = null; } }));
  const close = openSheet(body, { center: true, locked: true });
  S.pendingOut = { inviteId: m.inviteId, close };
}

function renderInvites() {
  const box = $('#inviteBox');
  box.replaceChildren(...S.invites.slice(-2).map((inv) => {
    const g = GAMES[inv.game];
    const desc = g && g.describe ? g.describe(inv.opts) : '';
    const el = h('div', { class: 'invite-banner' },
      h('div', { class: 'row' },
        h('div', { class: 'ico', html: g ? g.icon : '🎮', style: { width: '44px', height: '44px', borderRadius: '14px', display: 'grid', placeItems: 'center', fontSize: '24px', background: 'var(--soft)', flex: 'none' } }),
        h('div', { class: 'grow' }, h('b', { text: inv.fromName + ' wants to play' }), h('div', { class: 'muted small', text: (g ? g.name : inv.game) + (desc ? ' · ' + desc : '') }))),
      h('div', { class: 'row', style: { marginTop: '12px' } },
        h('button', { class: 'btn grow', text: 'Decline', onclick: () => { wsSend({ t: 'invite_reply', inviteId: inv.inviteId, accept: false }); S.invites = S.invites.filter((i) => i !== inv); renderInvites(); } }),
        h('button', { class: 'btn ok grow', text: 'Accept', onclick: () => { wsSend({ t: 'invite_reply', inviteId: inv.inviteId, accept: true }); S.invites = S.invites.filter((i) => i !== inv); renderInvites(); } })),
      h('div', { class: 'bar' }, h('i')));
    return el;
  }));
  updateBadges();
}

/* ------------------------------------------------------------- game host */
function startRoom(m) {
  closeAllSheets(); S.pendingOut = null; S.invites = []; renderInvites();
  const def = GAMES[m.game];
  if (!def) { toast('This device does not know that game'); wsSend({ t: 'leave_room' }); return; }
  S.room = { id: m.room, players: m.players, idx: m.you };
  S.roomChat = []; S.unreadRoom = 0;
  openGame(def, 'multi', m.opts || {}, S.room);
  toast('Game on! vs ' + m.players[1 - m.you].name);
  vibrate(80);
}

function openGame(def, mode, opts, room) {
  if (S.game) teardownGame();
  const body = h('div', { class: 'gbody' });
  const badge = h('span', { class: 'badge', hidden: true });
  const sub = h('span', { text: mode === 'multi' ? 'vs ' + room.players[1 - room.idx].name : (def.soloSub || 'Solo') });
  const chatBtn = h('button', { class: 'iconbtn', 'aria-label': 'Chat', onclick: () => toggleChat() }, ico('chat'), badge);
  const root = h('div', { class: 'game-screen' },
    h('div', { class: 'gbar' },
      h('button', { class: 'iconbtn', 'aria-label': 'Back', onclick: () => requestLeave(false) }, ico('back')),
      h('div', { class: 'ttl' }, h('b', { text: def.name }), sub),
      chatBtn),
    body);
  $('#gameRoot').append(root);
  const ctx = {
    root: body, mode, opts, idx: room ? room.idx : 0, isHost: !room || room.idx === 0,
    me: S.me, opp: room ? room.players[1 - room.idx] : null,
    gone: false, over: false,
    send: (data) => { if (mode === 'multi' && !ctx.gone) wsSend({ t: 'game', data }); },
    setSub: (t) => { sub.textContent = t; },
    toast, confetti, vibrate,
    leave: () => requestLeave(true),
  };
  S.game = { def, mode, opts, root, body, ctx, badge, sub, drawer: null, chatBox: null, inst: null };
  history.pushState({ g: 1 }, '');
  updateBadges();
  S.game.inst = def.create(ctx);
}

function toggleChat() {
  const g = S.game; if (!g) return;
  if (g.drawer) { g.chatBox.destroy(); g.drawer.remove(); g.drawer = null; g.chatBox = null; syncChat(); return; }
  const kind = g.mode === 'multi' ? 'room' : 'global';
  const box = ChatBox(kind);
  const drawer = h('div', { class: 'chatdrawer' },
    h('div', { class: 'hd' }, h('b', { text: kind === 'room' ? 'Chat with ' + g.ctx.opp.name : 'Lobby chat' }),
      h('button', { class: 'iconbtn', 'aria-label': 'Close chat', onclick: () => toggleChat() }, ico('close'))),
    box.el);
  g.root.append(drawer); g.drawer = drawer; g.chatBox = box;
  if (kind === 'room') S.unreadRoom = 0;
  updateBadges();
  box.render();
  syncChat();
}

function showGameNotice(text) {
  const g = S.game; if (!g) return;
  const old = $('.gnotice', g.root); if (old) old.remove();
  const n = h('div', { class: 'gnotice', style: { position: 'absolute', left: '12px', right: '12px', top: 'calc(var(--st) + 68px)', zIndex: 9, background: '#fff', border: '1.5px solid var(--warn)', borderRadius: '16px', padding: '12px 14px', boxShadow: 'var(--shadow)', display: 'flex', gap: '10px', alignItems: 'center' } },
    h('div', { class: 'grow', style: { fontWeight: 700 }, text: text }),
    h('button', { class: 'btn sm primary', text: 'Leave', onclick: () => closeGame(false) }));
  g.root.append(n);
}

function teardownGame() {
  const g = S.game; if (!g) return;
  try { if (g.inst && g.inst.destroy) g.inst.destroy(); } catch (e) { /* ignore */ }
  if (g.chatBox) g.chatBox.destroy();
  g.root.remove(); S.game = null;
  syncChat();
}

function closeGame(fromPop) {
  const g = S.game; if (!g) return;
  if (S.room) { wsSend({ t: 'leave_room' }); S.room = null; }
  teardownGame();
  if (!fromPop && history.state && history.state.g) { S.skipPop = true; history.back(); }
  renderAll();
}

function requestLeave(fromPop) {
  const g = S.game; if (!g) return;
  const needConfirm = g.mode === 'multi' && S.room && !g.ctx.over && !g.ctx.gone;
  if (!needConfirm) { closeGame(fromPop); return; }
  confirmDialog('Leave this game?', 'Your friend will be told that you left.', 'Leave', () => closeGame(fromPop), () => { if (fromPop) history.pushState({ g: 1 }, ''); }, true);
}

window.addEventListener('popstate', () => {
  if (S.skipPop) { S.skipPop = false; return; }
  if (S.game) requestLeave(true);
});

/* ------------------------------------------------------------ fake loader */
function fakeLoader(done) {
  const el = $('#loader'), fill = $('#ldFill'), msg = $('#ldMsg'), pct = $('#ldPct');
  if (!el) { done(); return; }
  const lines = [
    [0, 'Warming things up…'], [18, 'Teaching Stockfish some manners…'], [38, 'Shuffling 81 sudoku cells…'],
    [58, 'Telling everyone to stop talking and play…'], [78, 'Polishing the chess pieces…'], [93, 'Almost there… probably'],
  ];
  let p = 0, stalled = false, finished = false;
  const set = (v) => {
    p = Math.min(100, v);
    fill.style.width = p + '%'; pct.textContent = Math.floor(p) + '%';
    for (const [t, m] of lines) if (p >= t) msg.textContent = m;
  };
  const finish = () => {
    if (finished) return; finished = true; set(100); msg.textContent = 'Ready. Less talking, more playing!';
    setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.remove(); done(); }, 520); }, 450);
  };
  const tick = () => {
    if (finished) return;
    if (p >= 97 && !stalled) { stalled = true; set(99); setTimeout(finish, 900); return; }   // the classic "stuck at 99%" moment
    set(p + 3 + Math.random() * 11);
    setTimeout(tick, 120 + Math.random() * 260);
  };
  setTimeout(tick, 250);
  el.addEventListener('click', () => { if (p > 60) finish(); });      // impatient? tap to skip near the end
}

/* ------------------------------------------------------------------- boot */
let loaderDone = false, bootDone = false;

function showFatal(kind) {
  const msg = {
    config: ['Firebase is not set up yet', 'Fill in public/firebase-config.js with your Firebase web-app settings (see the README), then reload.'],
    google: ['Google sign-in is off', 'In the Firebase console open Authentication → Sign-in method and enable “Google”.'],
    domain: ['This website is not allowed to sign in', 'In the Firebase console open Authentication → Settings → Authorized domains and add this site’s domain.'],
    rules: ['Database is not ready', 'In the Firebase console create a Firestore database and publish firestore.rules (see the README), then reload.'],
    sdk: ['Could not load the game servers', 'Check your internet connection and reload the page.'],
    net: ['Could not connect', 'Check your internet connection and try again.'],
  }[kind] || ['Something went wrong', 'Please reload the page.'];
  openSheet(h('div', { style: { textAlign: 'center' } },
    h('div', { style: { fontSize: '34px', margin: '6px 0' }, text: '⚠️' }), h('h3', { text: msg[0] }),
    h('p', { class: 'muted', text: msg[1] }),
    h('button', { class: 'btn primary block', text: 'Reload', onclick: () => location.reload() })), { center: true, locked: true });
}

const errKind = (e) => !e ? 'net' : e.code === 'auth/operation-not-allowed' ? 'google' : e.code === 'auth/unauthorized-domain' ? 'domain'
  : e.code === 'permission-denied' ? 'rules' : 'net';

async function boot() {
  if (!NET.configured) S.err = 'config';
  else if (!NET.init()) S.err = 'sdk';
  else {
    NET.onStats = (st) => { S.stats = st; renderStats(); };
    try {
      await Promise.race([
        (async () => { if (await NET.restoreUser()) await loadAccount(); })(),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000)),
      ]);
    } catch (e) { S.err = errKind(e); }
  }
  bootDone = true; proceed();
}

/* after sign-in: one read of this account's row (name + points) */
async function loadAccount() {
  S.me.id = NET.uid();
  S.hasName = !!(await NET.loadProfile());
  if (S.hasName) S.me.name = NET.name();
  S.signedIn = true;
}

function openLogin() {
  const err = h('div', { class: 'small', style: { color: 'var(--bad)', fontWeight: 700, minHeight: '18px', marginTop: '8px' } });
  const btn = h('button', { class: 'btn gbtn block', type: 'button' },
    h('span', { html: '<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>' }),
    h('span', { text: 'Continue with Google' }));
  const body = h('div', { style: { textAlign: 'center' } },
    h('div', { class: 'logo big', style: { margin: '4px auto 10px' } }, h('img', { src: 'logo.png', alt: '', width: '84', height: '84' })),
    h('h3', { text: 'Welcome to Battalo Ra4y' }),
    h('p', { class: 'muted small', style: { margin: '4px 0 14px' }, text: 'Sign in with Google to keep your name and points on every device.' }),
    btn, err);
  const close = openSheet(body, { center: true, locked: true });
  btn.addEventListener('click', async () => {
    btn.disabled = true; err.textContent = '';
    try {
      const u = await NET.loginGoogle();
      if (!u) return;                                       // redirect flow: the page reloads
      await loadAccount();
      close(); proceed();
    } catch (e) {
      btn.disabled = false;
      if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) return;
      const k = errKind(e);
      if (k === 'google' || k === 'domain' || k === 'rules') { close(); showFatal(k); return; }
      err.textContent = 'Could not sign in. Check your internet and try again.';
    }
  });
}

function openAccount() {
  let close;
  const body = h('div', null,
    h('h3', { text: 'Your account' }),
    h('div', { class: 'row', style: { gap: '12px', margin: '10px 0 14px' } },
      h('div', { class: 'avatar', text: (S.me.name || '?').charAt(0).toUpperCase() }),
      h('div', { class: 'grow', style: { minWidth: 0 } }, h('b', { text: S.me.name }),
        h('div', { class: 'muted small', style: { overflowWrap: 'anywhere' }, text: (NET.user() && NET.user().email) || '' }))),
    h('button', { class: 'btn block', text: 'Change name', onclick: () => { close(); openNameSheet(false); } }),
    h('button', { class: 'btn danger block', style: { marginTop: '8px' }, text: 'Sign out', onclick: async (e) => { e.target.disabled = true; await NET.logout(); location.reload(); } }));
  close = openSheet(body);
}

function proceed() {
  if (!loaderDone || !bootDone) return;
  if (S.err) { showFatal(S.err); return; }
  if (!S.signedIn) { openLogin(); return; }
  if (!S.hasName) openNameSheet(true); else begin();
}

async function begin() {
  S.me.id = NET.uid(); S.me.name = NET.name();
  try { await NET.start(); } catch (e) { showFatal(errKind(e)); }
}

function setupPwa() {
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; renderHome(); });
  window.addEventListener('appinstalled', () => { S.installEvt = null; toast('Installed 🎉'); renderHome(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}

function init() {
  $$('.tab').forEach((t) => t.addEventListener('click', () => showView(t.dataset.v)));
  const cb = ChatBox('global');
  $('#chatHost').append(cb.el);
  renderAll();
  setupPwa();
  $('#conn').addEventListener('click', openAccount);
  fakeLoader(() => { loaderDone = true; proceed(); });
  boot();
}

;init();

</script>
